<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Переход...</title>
  <script src="/config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #94a3b8; font-size: 15px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Открываем бота...</p>

  <!-- VK Pixel -->
  <script>
    // Загружаем VK Pixel если задан ID
    if (window.VK_PIXEL_ID) {
      !function(){
        var t=document.createElement("script");
        t.type="text/javascript",
        t.async=!0,
        t.src="https://vk.com/js/api/openapi.js?169",
        t.onload=function(){
          VK.Retargeting.Init(window.VK_PIXEL_ID);
          VK.Retargeting.Hit();
          // Событие "начало" — конверсия
          VK.Retargeting.Event("start_bot");
        };
        document.head.appendChild(t);
      }();
    }
  </script>

  <script>
    // Получаем UTM из URL если есть
    var urlParams = new URLSearchParams(window.location.search);
    var source = urlParams.get('s') || urlParams.get('utm_source') || window.UTM || 'vkads';

    // Редиректим в бота через 1.2 сек (дать пикселю время сработать)
    setTimeout(function() {
      var botLink = window.BOT_LINK || 'https://t.me/your_bot';
      window.location.href = botLink + '?start=' + source;
    }, 1200);
  </script>
</body>
</html>
