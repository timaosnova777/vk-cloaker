    body {

      background: #09090f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      text-align: center;
    }
    .glow {
      position: absolute;
      top: 50%;

      transform: translate(-50%, -50%);

      height: 600px;
      background: radial-gradient(circle, rgba(124,92,252,0.15) 0%, transparent 60%);

    }
    p {
      font-size: 16px;
      color: #9898b8;
      margin: 0 0 40px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background: #7c5cfc;
      font-size: 18px;
      font-weight: 600;
      padding: 20px 48px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(124,92,252,0.4);
      transition: all 0.3s;
      animation: pulse 2s infinite;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(124,92,252,0.5);
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(124,92,252, 0.7); }
      70% { transform: scale(1.03); box-shadow: 0 0 0 15px rgba(124,92,252, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(124,92,252, 0); }
    }
    .trust {
      margin-top: 24px;
      font-size: 13px;
      color: #7070a0;
    }
    .trust strong { color: #34d399; font-weight: 600; }
    
    .service-icons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      opacity: 0.8;
    }
    .icon-box {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-wrap {

      gap: 12px;
      align-items: center;
    }
    .btn.secondary {
      background: rgba(255,255,255,0.05);
      box-shadow: none;
      border: 1px solid rgba(255,255,255,0.1);
      animation: none;
      padding: 16px 40px;
    }
    .btn.secondary:hover {
      background: rgba(255,255,255,0.1);
    }
  </style>
</head>
